<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>รายการคำสั่งซื้อ | HAIKYUU Admin</title>
<link rel="stylesheet" href="style.css">
<style>
  /* ส่วนเสริมเฉพาะหน้านี้ ไม่แตะไฟล์ style.css เดิม */
  .admin-section .container {
    max-width: 1180px;
  }
  .table-wrapper {
    overflow-x: auto;
    border: 1px solid var(--color-border);
    border-radius: var(--radius-md);
    background-color: var(--color-surface);
  }
  #ordersTable {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.9rem;
    white-space: nowrap;
  }
  #ordersTable thead th {
    text-align: left;
    font-family: var(--font-sans);
    font-size: 0.72rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--color-text-soft);
    background-color: var(--color-bg-alt);
    padding: 0.9rem 1rem;
    border-bottom: 1px solid var(--color-border);
  }
  #ordersTable tbody td {
    padding: 0.9rem 1rem;
    border-bottom: 1px solid var(--color-border);
    color: var(--color-text);
    white-space: normal;
  }
  #ordersTable tbody tr:last-child td {
    border-bottom: none;
  }
  #ordersTable tbody tr:hover {
    background-color: var(--color-bg-alt);
  }
</style>
</head>
<body>

<header class="navbar">
  <div class="logo">HAIKYUU</div>
  <nav>
    <ul>
      <li><a href="index.html">หน้าแรก</a></li>
      <li><a href="product.html">สินค้าทั้งหมด</a></li>
    </ul>
  </nav>
</header>

<section class="admin-section">
  <div class="container">
    <div class="section-title">
      <span class="eyebrow">Admin</span>
      <h2>รายการคำสั่งซื้อ</h2>
    </div>

    <div class="table-wrapper">
      <table id="ordersTable">
        <thead>
          <tr>
            <th>วันเวลา</th>
            <th>ชื่อลูกค้า</th>
            <th>เบอร์โทร/Line</th>
            <th>รายการสินค้า</th>
            <th>จำนวนเงินรวม</th>
            <th>หมายเหตุ</th>
          </tr>
        </thead>
        <tbody>
          <!-- script.js จะดึงข้อมูลจาก Google Sheet มาเติมที่นี่ -->
        </tbody>
      </table>
    </div>
  </div>
</section>

<footer>
  <div class="container">
    <div class="logo">HAIKYUU</div>
    <p>รองเท้าวอลเลย์บอลพรีเมียม สำหรับทุกจังหวะบนคอร์ท</p>
    <div class="footer-bottom">&copy; 2026 HAIKYUU. All rights reserved.</div>
  </div>
</footer>

<script src="script.js"></script>
</body>
</html>
