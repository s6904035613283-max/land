<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>สั่งซื้อสินค้า | HAIKYUU</title>
<link rel="stylesheet" href="style.css">
<style>
  /* ส่วนเสริมเฉพาะหน้านี้ ไม่แตะไฟล์ style.css เดิม */
  .order-section .container {
    max-width: 640px;
  }
  .order-form {
    background-color: var(--color-surface);
    border: 1px solid var(--color-border);
    border-radius: var(--radius-md);
    padding: var(--space-lg) var(--space-md);
  }
  .form-group {
    margin-bottom: var(--space-md);
  }
  .form-group label {
    display: block;
    font-size: 0.75rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--color-text-soft);
    margin-bottom: 0.5rem;
  }
  .form-group input,
  .form-group textarea {
    width: 100%;
    padding: 0.85rem 1rem;
    font-family: var(--font-sans);
    font-size: 0.95rem;
    color: var(--color-text);
    background-color: var(--color-bg);
    border: 1px solid var(--color-border);
    border-radius: var(--radius-sm);
    transition: border-color var(--transition-base);
  }
  .form-group textarea {
    resize: vertical;
    min-height: 90px;
  }
  .form-group input:focus,
  .form-group textarea:focus {
    outline: none;
    border-color: var(--color-accent);
  }
  .form-group input[readonly] {
    color: var(--color-text-soft);
    background-color: var(--color-bg-alt);
  }
  .order-form .btn {
    width: 100%;
    margin-top: var(--space-sm);
  }
</style>
</head>
<body>

<header class="navbar">
  <div class="logo">HAIKYUU</div>
  <nav>
    <ul>
      <li><a href="index.html">หน้าแรก</a></li>
      <li><a href="product.html">สินค้าทั้งหมด</a></li>
    </ul>
  </nav>
</header>

<section class="order-section">
  <div class="container">
    <div class="section-title">
      <span class="eyebrow">Checkout</span>
      <h2>ยืนยันการสั่งซื้อ</h2>
    </div>

    <form id="orderForm" class="order-form">
      <div class="form-group">
        <label for="customerName">ชื่อลูกค้า</label>
        <input type="text" id="customerName" name="customerName" required>
      </div>

      <div class="form-group">
        <label for="contact">เบอร์โทร / Line</label>
        <input type="text" id="contact" name="contact" required>
      </div>

      <div class="form-group">
        <label for="items">รายการสินค้า</label>
        <input type="text" id="items" name="items">
      </div>

      <div class="form-group">
        <label for="total">จำนวนเงินรวม (บาท)</label>
        <input type="text" id="total" name="total">
      </div>

      <div class="form-group">
        <label for="note">หมายเหตุ</label>
        <textarea id="note" name="note" placeholder="เช่น ไซส์ที่ต้องการ, ที่อยู่จัดส่ง"></textarea>
      </div>

      <button type="submit" class="btn btn-primary">ยืนยันสั่งซื้อ</button>
    </form>
  </div>
</section>

<footer>
  <div class="container">
    <div class="logo">HAIKYUU</div>
    <p>รองเท้าวอลเลย์บอลพรีเมียม สำหรับทุกจังหวะบนคอร์ท</p>
    <div class="footer-bottom">&copy; 2026 HAIKYUU. All rights reserved.</div>
  </div>
</footer>

<script src="script.js"></script>
</body>
</html>
